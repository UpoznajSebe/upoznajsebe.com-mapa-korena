<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Mapa pojmova · Koren anksioznosti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --krem:#FAF8F4; --karta:#FFFFFF; --tekst:#3A322C; --naslov:#1E1A18;
    --meko:#6F6357; --linija:#E0D5C8; --placeholder:#8C7D6E; --sivo:#8C7D6E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--krem); color:var(--tekst);
    font-family:'Jost',-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight:300; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px; margin:0 auto; padding:40px 20px 60px;}
  .hero{position:relative; height:min(48vh,420px); min-height:300px; overflow:hidden; display:flex; align-items:flex-end; justify-content:center;}
  .hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 40%;}
  .hero .sloj{position:absolute; inset:0; background:linear-gradient(to bottom, rgba(20,15,12,.28) 0%, rgba(20,15,12,.10) 45%, rgba(20,15,12,.55) 100%);}
  .hero .sadrzaj{position:relative; text-align:center; color:#fff; padding:0 20px 44px;}
  .hero .nadnaslov{font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:#F4E4C8; margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:12px;}
  .hero .nadnaslov::before,.hero .nadnaslov::after{content:''; width:30px; height:1px; background:#D4B07A; opacity:.8;}
  .hero h1{font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; font-size:clamp(40px,8vw,62px); letter-spacing:.05em; text-transform:uppercase; line-height:1; margin-bottom:12px;}
  .hero h1 em{display:block; font-style:italic; text-transform:none; letter-spacing:.01em; font-size:1.08em;}
  .hero p{font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:19px; color:rgba(255,255,255,.88);}
  h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,serif;}
  header{text-align:center; margin-bottom:28px;}
  header h1{font-size:40px; font-weight:500; color:var(--naslov); margin-bottom:4px;}
  header p{font-size:14px; color:#6F6357; letter-spacing:.3px;}

  .pretraga-wrap{position:relative; margin-bottom:16px;}
  .pretraga-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--placeholder);}
  #pretraga{
    width:100%; border:1px solid var(--linija); background:var(--karta);
    border-radius:999px; padding:11px 18px 11px 40px; font-size:14px;
    font-family:'Jost',sans-serif; color:var(--tekst); outline:none;
  }
  #pretraga:focus{border-color:#B8965A;}

  .filteri{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px;}
  .chip{
    border:1px solid; border-radius:999px; padding:6px 14px; font-size:14px;
    background:transparent; cursor:pointer; font-family:'Jost',sans-serif;
    transition:all .2s; line-height:1.3;
  }
  .grupa{margin-bottom:28px;}
  .grupa-nasl{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .grupa-nasl span.linija{height:1px; flex:1; opacity:.3;}
  .grupa-nasl h2{font-family:'Jost',sans-serif; font-size:12px; text-transform:uppercase;
    letter-spacing:2px; font-weight:400; white-space:nowrap;}
  .kartice{display:grid; gap:10px; grid-template-columns:1fr;}
  @media(min-width:560px){.kartice{grid-template-columns:1fr 1fr;}}
  .kartica{
    text-align:left; border:1px solid var(--linija); background:var(--karta);
    border-radius:16px; padding:16px; cursor:pointer; transition:all .2s;
    font-family:'Jost',sans-serif;
  }
  .kartica:hover{box-shadow:0 6px 20px rgba(61,36,64,.10); transform:translateY(-1px);}
  .kartica .naz{font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--naslov); margin-bottom:4px;}
  .kartica .opis{font-size:13px; color:var(--meko); line-height:1.4;}

  /* detalj */
  .nazad{display:inline-flex; align-items:center; gap:6px; background:none; border:none;
    color:#6F6357; font-size:14px; cursor:pointer; margin-bottom:20px; font-family:'Jost',sans-serif;}
  .nazad:hover{opacity:.7;}
  .detalj{border:1px solid var(--linija); background:var(--karta); border-radius:24px; padding:28px 24px;}
  @media(min-width:560px){.detalj{padding:36px;}}
  .oblast-tag{font-size:12px; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px;}
  .detalj h2{font-size:32px; font-weight:500; color:var(--naslov); margin-bottom:22px;}
  .polje{margin-bottom:20px;}
  .polje-nasl{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .polje-nasl .lbl{font-size:11px; text-transform:uppercase; letter-spacing:2px; opacity:.85;}
  .polje-txt{font-size:15px; line-height:1.65; color:var(--tekst);}
  .polje-txt.italic{font-style:italic; color:#5A4E45;}
  .napomena{background:#F2EDE6; color:#3A322C; border-radius:16px; padding:14px 16px; font-size:14px; margin-bottom:20px; line-height:1.6;}
  .veze-nasl{font-size:11px; text-transform:uppercase; letter-spacing:2px; opacity:.8; margin-bottom:10px;}
  .veze{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .lit{padding-top:16px; border-top:1px solid var(--linija);}
  .lit .lbl{font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--placeholder); margin-bottom:8px;}
  .lit ul{list-style:none; font-size:13px; color:var(--meko); line-height:1.7;}

  footer{text-align:center; font-size:12px; color:var(--sivo); margin-top:40px; line-height:1.7;}
  .prazno{text-align:center; color:var(--placeholder); padding:40px 0; font-size:14px;}
  .ikona{width:16px; height:16px; flex:none;}
</style>
</head>

const MAP = Object.fromEntries(POJMOVI.map(p=>[p.id,p]));
const app = document.getElementById('app');
let filterOblast = null, pretraga = "";

function ico(d){return `<svg class="ikona" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;}
const I = {
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  back:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/>',
  anchor:'<circle cx="12" cy="5" r="3"/><path d="M12 22V8M5 12H2a10 10 0 0 0 20 0h-3"/>',
  spark:'<path d="M12 3v18M3 12h18"/>',
  compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
};

function render(){
  if(location.hash && MAP[location.hash.slice(1)]) return renderDetalj(MAP[location.hash.slice(1)]);
  renderLista();
}

function renderLista(){
  let list = POJMOVI.slice();
  if(filterOblast) list = list.filter(x=>x.oblast===filterOblast);
  if(pretraga.trim()){
    const q = pretraga.toLowerCase();
    list = list.filter(x=>x.naziv.toLowerCase().includes(q)||x.definicija.toLowerCase().includes(q));
  }
  const grupe = {};
  list.forEach(x=>{(grupe[x.oblast]=grupe[x.oblast]||[]).push(x);});

  let html = `
  <div class="pretraga-wrap">${ico(I.search)}
    <input id="pretraga" placeholder="Pretraži pojam..." value="${pretraga.replace(/"/g,'&quot;')}"/>
  </div>
  <div class="filteri">
    <button class="chip" data-o="" style="border-color:#3D2440;${!filterOblast?'background:#3D2440;color:#FAF8F4':'color:#3D2440'}">Sve</button>
    ${Object.entries(OBLASTI).map(([k,o])=>`<button class="chip" data-o="${k}" style="border-color:${o.boja};${filterOblast===k?`background:${o.boja};color:#FAF8F4`:`color:${o.boja}`}">${o.naziv}</button>`).join('')}
  </div>`;

  if(list.length===0){
    html += `<div class="prazno">Nema pojma koji odgovara pretrazi.</div>`;
  } else {
    for(const [ob,arr] of Object.entries(grupe)){
      const o = OBLASTI[ob];
      html += `<section class="grupa">
        <div class="grupa-nasl">
          <span class="linija" style="background:${o.boja}"></span>
          <h2 style="color:${o.boja}">${o.naziv}</h2>
          <span class="linija" style="background:${o.boja}"></span>
        </div>
        <div class="kartice">
          ${arr.map(x=>`<button class="kartica" data-id="${x.id}">
            <div class="naz">${x.naziv}</div>
            <div class="opis">${x.definicija.split(' - ')[0].slice(0,90)}${x.definicija.length>90?'...':''}</div>
          </button>`).join('')}
        </div>
      </section>`;
    }
  }
  app.innerHTML = html;

  const inp = document.getElementById('pretraga');
  inp.addEventListener('input', e=>{ pretraga=e.target.value; const pos=e.target.selectionStart; renderLista(); const n=document.getElementById('pretraga'); n.focus(); n.setSelectionRange(pos,pos); });
  app.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{filterOblast=b.dataset.o||null; renderLista();}));
  app.querySelectorAll('.kartica').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.id; window.scrollTo(0,0);}));
}

function polje(ikonaKey,lbl,boja,txt,italic){
  return `<div class="polje">
    <div class="polje-nasl" style="color:${boja}">${ico(I[ikonaKey])}<span class="lbl">${lbl}</span></div>
    <div class="polje-txt${italic?' italic':''}">${txt}</div>
  </div>`;
}

function renderDetalj(p){
  const o = OBLASTI[p.oblast], boja = o.boja;
  let html = `<button class="nazad" id="nazad">${ico(I.back)} Nazad na mapu</button>
  <div class="detalj">
    <div class="oblast-tag" style="color:${boja}">${o.naziv} · ${o.modul}</div>
    <h2>${p.naziv}</h2>
    ${polje('book','Šta je to',boja,p.definicija)}
    ${p.kakoZvuci?polje('spark','Kako zvuči iznutra',boja,p.kakoZvuci,true):''}
    ${polje('heart','Kako se oseti u telu',boja,p.telo)}
    ${polje('anchor','Odakle dolazi',boja,p.koren)}
    ${polje('compass','Prvi korak',boja,p.prviKorak)}
    ${p.napomena?`<div class="napomena">${p.napomena}</div>`:''}
    ${p.veze&&p.veze.length?`<div class="veze-nasl" style="color:${boja}">Povezano sa</div>
      <div class="veze">${p.veze.filter(v=>MAP[v]).map(v=>{const vb=OBLASTI[MAP[v].oblast].boja;return `<button class="chip" data-go="${v}" style="border-color:${vb};color:${vb}">${MAP[v].naziv}</button>`;}).join('')}</div>`:''}
    ${p.literatura&&p.literatura.length?`<div class="lit"><div class="lbl">Za dublje čitanje</div><ul>${p.literatura.map(l=>`<li>· ${l}</li>`).join('')}</ul></div>`:''}
  </div>`;
  app.innerHTML = html;
  document.getElementById('nazad').addEventListener('click',()=>{location.hash=''; window.scrollTo(0,0);});
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.go; window.scrollTo(0,0);}));
}

window.addEventListener('hashchange', render);
render();
